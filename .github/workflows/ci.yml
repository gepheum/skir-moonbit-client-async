name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.9.2+bbe2b338f'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain version
        run: moon version

      - name: Bootstrap local module dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deps

          # `gepheum/skir-client` and `moonbitlang/async` may not be published
          # to the registry when this workflow runs.
          if [ ! -d deps/skir-client ]; then
            git clone --depth 1 https://github.com/gepheum/skir-moonbit-client deps/skir-client
          fi

          if [ ! -d deps/async ]; then
            git clone --depth 1 https://github.com/moonbitlang/async deps/async
          fi

          cat > moon.work <<'EOF'
          members = [
            ".",
            "deps/skir-client",
            "deps/async",
          ]
          EOF

      - name: Show workspace members
        run: cat moon.work

      - name: Check formatting
        run: moon fmt --check .

      - name: Typecheck
        run: moon check .

      - name: Run tests
        run: moon test .
